[project]
site_name = "haidra-param-sweeps"
site_description = "Render the AI Horde parameter-sweep illustration library from a declarative specification."
repo_url = "https://github.com/Haidra-Org/haidra-param-sweeps"
repo_name = "Haidra-Org/haidra-param-sweeps"
edit_uri = "edit/main/docs/"
copyright = "AGPL-3.0-or-later"

nav = [
    { "Home" = "README.md" },
    { "Explanation" = [
        { "Overview" = "explanation/README.md" },
    ] },
    { "Reference" = [
        { "Overview" = "reference/README.md" },
    ] },
    { "How-to" = [
        { "Overview" = "how-to/README.md" },
    ] },
]

[project.extra.status]
stub = "Not yet documented in full"

[project.theme]
variant = "modern"
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "navigation.footer",
    "navigation.indexes",
    "navigation.path",
    "navigation.tabs",
    "navigation.top",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

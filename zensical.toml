[project]
site_name = "haidra-param-sweeps"
site_description = "Render the AI Horde parameter-sweep illustration library from a declarative specification."
repo_url = "https://github.com/Haidra-Org/haidra-param-sweeps"
repo_name = "Haidra-Org/haidra-param-sweeps"
edit_uri = "edit/main/docs/"
copyright = "AGPL-3.0-or-later"

nav = [
    { "Home" = "README.md" },
    { "Explanation" = [
        { "Overview" = "explanation/README.md" },
        { "One parameter per strip" = "explanation/one-parameter-per-strip.md" },
        { "QR codes that scan" = "explanation/qr-codes.md" },
        { "Alchemy evidence" = "explanation/alchemy-evidence.md" },
        { "Sampler cost measurement" = "explanation/sampler-cost-measurement.md" },
        { "Publishing and caching" = "explanation/publishing-and-caching.md" },
    ] },
    { "Reference" = [
        { "Overview" = "reference/README.md" },
        { "Sweep specification" = "reference/sweep-specification.md" },
        { "Campaign specifications" = "reference/campaign-specifications.md" },
        { "Review sheet" = "reference/review-sheet.md" },
        { "Command line" = "reference/cli.md" },
        { "Environment variables" = "reference/environment.md" },
        { "Output tree" = "reference/output-tree.md" },
        { "Publishing contract" = "reference/publishing.md" },
    ] },
    { "How-to" = [
        { "Overview" = "how-to/README.md" },
        { "Set up the runners" = "how-to/set-up-runners.md" },
        { "Render the library" = "how-to/render-library.md" },
        { "Review a batch" = "how-to/review-batch.md" },
        { "Run the alchemy campaign" = "how-to/run-alchemy.md" },
        { "Render the tutorial examples" = "how-to/render-tutorial-flows.md" },
        { "Make share cards and the promo gallery" = "how-to/make-promo-material.md" },
        { "Measure sampler cost" = "how-to/measure-sampler-cost.md" },
        { "Publish the library" = "how-to/publish.md" },
    ] },
]

[project.extra.status]
stub = "Not yet documented in full"

[project.theme]
variant = "modern"
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "navigation.footer",
    "navigation.indexes",
    "navigation.path",
    "navigation.tabs",
    "navigation.top",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Strict site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked documentation environment
        run: uv sync --locked --only-group docs

      - name: Build the site in strict mode
        run: uv run --no-sync zensical build --clean --strict

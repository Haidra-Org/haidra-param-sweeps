name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # ruff and mypy already ran above. The remaining hooks check whitespace, line endings and
      # file syntax.
      - name: pre-commit hygiene hooks
        env:
          SKIP: ruff-check,ruff-format,mypy
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pyzbar is a ctypes wrapper and loads the zbar shared library at runtime. The QR decode
      # tests fail without it.
      - name: Install the zbar library
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libzbar0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # The default dev group includes the publish extra. The local and torch extras are left out
      # because they install a GPU stack.
      - name: Install the locked environment
        run: uv sync --locked

      - name: pytest
        run: uv run pytest -ra
